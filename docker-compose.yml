# Batas ukuran log container: tiap layanan maksimal 3 berkas x 10 MB.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17.11-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:?isi DB_DATABASE di file .env}
      POSTGRES_USER: ${DB_USERNAME:?isi DB_USERNAME di file .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?isi DB_PASSWORD di file .env}
    volumes:
      # Named volume: data tetap ada walau container dihapus (docker compose down).
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?isi APP_KEY di file .env}
      APP_URL: ${APP_URL:-http://localhost:8081}
      LOG_CHANNEL: stdout
      LOG_LEVEL: info
      CACHE_STORE: file
      # Backend memakai NAMA SERVICE "db" sebagai host, bukan IP laptop/server.
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SEED_USER_EMAIL: ${SEED_USER_EMAIL:-admin@example.com}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:?isi SEED_USER_PASSWORD di file .env}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    # /health memeriksa basis data dan cache; balasan 503 membuat container unhealthy.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 40s
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      args:
        # "/api" = kirim ke host yang sama, lalu Nginx meneruskan ke service backend.
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    logging: *default-logging

volumes:
  pgdata:

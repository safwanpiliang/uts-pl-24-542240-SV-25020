server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Teruskan permintaan API ke service backend di jaringan Docker Compose.
    # Nama host dicari lewat DNS bawaan Docker saat permintaan masuk, sehingga
    # Nginx tetap bisa start walau backend belum siap.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Aset hasil build memakai nama berhash, aman di-cache lama.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single Page App: semua rute lain dikembalikan ke index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
